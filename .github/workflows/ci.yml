name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  clippy-advisory:
    name: clippy (advisory / stable)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-

      - name: Clippy (stable)
        run: cargo clippy --all-targets -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: stable

  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.94, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      # Without this the repo's rust-toolchain.toml would pin every matrix leg
      # to the MSRV, so the `stable` leg would silently retest 1.94 and report
      # a green check for a toolchain it never ran.
      - name: Test with locked dependencies
        run: cargo test --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

  openapi:
    name: openapi lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Lints the spec's shape (redocly.yaml extends `recommended`). The
      # complementary spec↔router cross-check — that documented paths actually
      # resolve and that the deprecated mount carries its headers — is the
      # `openapi_contract` integration test, which runs in the `test` job above.
      # Major pinned to match what the spec was validated against locally.
      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@1 lint openapi.yaml

  deploy-consistency:
    name: deploy asset consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches Dockerfile/compose port or healthcheck drift, and a real
      # secret slipping into deploy/stellargate.env.example, before it merges
      # rather than at deploy time (issues #444, #447).
      - name: Check deploy assets against Dockerfile
        run: bash scripts/check-deploy-consistency.sh

  # Builds the image we actually ship and runs it, so a broken healthcheck
  # (e.g. a removed `healthcheck` subcommand) fails CI instead of passing the
  # static deploy-consistency check above (issue #872).
  docker-smoke:
    name: docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: stellargate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f deploy/docker-compose.prod.yml config

      - name: Run and wait for healthy
        run: |
          docker run -d --name sg -p 3000:3000 \
            -e STELLAR_GATEWAY_PUBLIC=UNCONFIGURED \
            -e WEBHOOK_SECRET=$(openssl rand -hex 32) \
            stellargate:ci
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' sg)
            [ "$s" = healthy ] && exit 0
            [ "$s" = unhealthy ] && break
            sleep 2
          done
          docker logs sg; docker inspect sg --format '{{json .State.Health}}'; exit 1

      - name: Probe endpoints
        run: |
          curl -fsS localhost:3000/health
          curl -fsS localhost:3000/ready
          curl -fsS -o /dev/null -w '%{http_code}\n' localhost:3000/dashboard | grep 200

      - name: Verify non-root uid and writable /data
        run: |
          test "$(docker exec sg id -u)" = 1001
          docker exec sg sh -c 'touch /data/.smoke && rm /data/.smoke'

      - name: Dump container logs on failure
        if: failure()
        run: docker logs sg || true

  # Belt-and-suspenders alongside supply-chain.yml: running cargo audit
  # directly in CI ensures every PR gets a RustSec advisory scan even without
  # the scheduled weekly supply-chain workflow. Mirrors the same RUSTSEC ignore
  # list kept in supply-chain.yml — see that file for the full triage rationale.
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Coverage is measured with cargo-llvm-cov (works on the pinned stable
  # toolchain, no nightly required) and reported only — there is deliberately
  # no absolute threshold here. The LCOV report is uploaded as a build
  # artifact and to Codecov, whose status check flags regressions against the
  # recorded baseline rather than enforcing a fixed floor (issue #292).
  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
